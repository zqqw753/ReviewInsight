<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ReviewInsight · 评论分析 Agent</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1c2430;
    --muted: #6b7687;
    --line: #e3e7ee;
    --accent: #2563eb;
    --accent-weak: #eef3ff;
    --ok: #0f9d76;
    --warn: #b45309;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 28px 20px 48px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .tag {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    background: var(--accent-weak); color: var(--accent);
    font-size: 12px; font-weight: 600;
  }
  .grid { margin-top: 22px; display: grid; grid-template-columns: 360px 1fr; gap: 18px; }
  @media (max-width: 880px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px;
  }
  .field { margin-bottom: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .hint { font-weight: 400; color: var(--muted); }
  input[type="text"], textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font: inherit; font-size: 14px; background: #fbfcfe;
    color: var(--text); outline: none;
  }
  input[type="text"]:focus, textarea:focus { border-color: var(--accent); background: #fff; }
  textarea { min-height: 88px; resize: vertical; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--line); background: #fff; color: var(--muted);
    padding: 5px 10px; border-radius: 999px; font-size: 12px; cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .switch { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  button.run {
    width: 100%; margin-top: 4px; border: 0; border-radius: 10px; padding: 11px 14px;
    background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
  }
  button.run:disabled { opacity: 0.55; cursor: wait; }
  button.ghost {
    border: 1px solid var(--line); background: #fff; color: var(--muted);
    border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .status { margin-top: 10px; font-size: 12px; color: var(--muted); min-height: 18px; }
  .session { font-size: 12px; color: var(--muted); }
  .answer {
    margin: 0; white-space: pre-wrap; word-break: break-word;
    font-size: 14px; line-height: 1.7;
  }
  .result-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
  .result-head h2 { margin: 0; font-size: 15px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge {
    font-size: 11px; color: var(--muted); background: #f4f6fa;
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px;
  }
  .badge.ok { color: var(--ok); background: #eefaf5; border-color: #c9efe2; }
  .badge.warn { color: var(--warn); background: #fff7ed; border-color: #fed7aa; }
  .stats { margin: 14px 0 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  @media (max-width: 620px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat { background: #f8fafc; border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .stat b { display: block; font-size: 20px; letter-spacing: -0.02em; }
  .stat span { font-size: 11px; color: var(--muted); }
  .bars { margin-top: 14px; }
  .bar-row { display: grid; grid-template-columns: 76px 1fr 54px; gap: 8px; align-items: center; margin-bottom: 6px; font-size: 12px; }
  .bar { height: 7px; background: #eef1f6; border-radius: 999px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, #60a5fa, #2563eb); }
  .bar-row small { color: var(--muted); text-align: right; }
  .sources { margin-top: 14px; font-size: 12px; color: var(--muted); }
  .sources code { background: #f4f6fa; border-radius: 6px; padding: 2px 6px; margin-right: 6px; display: inline-block; margin-bottom: 4px; }
  .trace { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 6px; }
  .trace span { font-size: 11px; color: var(--muted); border: 1px dashed var(--line); border-radius: 6px; padding: 3px 7px; }
  .nodes { margin-top: 8px; font-size: 12px; color: var(--muted); line-height: 1.9; }
  .placeholder { color: #9aa4b2; font-size: 13px; line-height: 1.8; padding: 24px 0; text-align: center; }
  footer { margin-top: 20px; font-size: 12px; color: var(--muted); }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ReviewInsight</h1>
    <span class="tag">评论分析 Agent</span>
    <p>数字由代码从数据库生成，模型只负责判断与解释。</p>
  </header>

  <div class="grid">
    <section class="card">
      <div class="field">
        <label>产品 <span class="hint">product_id</span></label>
        <input id="product" type="text" value="shopping_phone" />
      </div>
      <div class="field">
        <label>问题</label>
        <textarea id="question" placeholder="例如：电池有什么缺点？">电池有什么缺点？</textarea>
        <div class="chips" id="examples" style="margin-top:8px">
          <button class="chip" data-q="电池有什么缺点？">电池缺点</button>
          <button class="chip" data-q="外观设计有哪些优点？">外观优点</button>
          <button class="chip" data-q="这个手机值得买吗？">值不值得买</button>
          <button class="chip" data-q="整体评价怎么样？">整体评价</button>
        </div>
      </div>
      <div class="field row">
        <span class="switch"><input id="multi" type="checkbox" /> 多轮会话</span>
        <span class="switch"><input id="stream" type="checkbox" checked /> 流式进度</span>
        <span class="session" id="sessionLabel"></span>
        <button class="ghost" id="newSession" type="button">新会话</button>
      </div>
      <button class="run" id="run" type="button">开始分析</button>
      <div class="status" id="status"></div>
      <div class="nodes" id="nodes"></div>
    </section>

    <section class="card">
      <div class="result-head">
        <h2>分析结果</h2>
        <div class="badges" id="badges"></div>
      </div>
      <div id="answerBox">
        <div class="placeholder">
          提问后这里会显示结论、真实统计、证据来源与节点耗时。<br />
          多轮示例：先问「电池有什么缺点？」，再问「那优点呢」。
        </div>
      </div>
      <div class="stats" id="stats"></div>
      <div class="bars" id="bars"></div>
      <div class="sources" id="sources"></div>
      <div class="trace" id="trace"></div>
    </section>
  </div>

  <footer>
    API 文档 <a href="/docs" target="_blank">/docs</a> ·
    指标 <a href="/metrics" target="_blank">/metrics</a> ·
    健康检查 <a href="/health" target="_blank">/health</a>
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
let sessionId = null;

function newSession() {
  sessionId = "demo-" + Date.now().toString(36);
  $("sessionLabel").textContent = sessionId;
}

function esc(text) {
  return String(text == null ? "" : text).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

$("examples").addEventListener("click", (event) => {
  const button = event.target.closest(".chip");
  if (!button) return;
  $("question").value = button.dataset.q;
});

$("newSession").addEventListener("click", newSession);
$("multi").addEventListener("change", () => {
  if ($("multi").checked && !sessionId) newSession();
  if (!$("multi").checked) { sessionId = null; $("sessionLabel").textContent = ""; }
});

function setStatus(text) { $("status").textContent = text; }

function render(result, meta) {
  if (result && result.answer) {
    $("answerBox").innerHTML = '<p class="answer">' + esc(result.answer) + "</p>";
  }
  renderStats(result && result.stats);
  renderSources(result && result.sources);
  renderMeta(meta || (result && result.meta) || null);
}

function renderStats(stats) {
  const statsBox = $("stats");
  const barsBox = $("bars");
  statsBox.innerHTML = "";
  barsBox.innerHTML = "";
  if (!stats) return;

  if (stats.breakdown && stats.breakdown.length) {
    statsBox.innerHTML = [
      card(stats.mentions, "各方面提及"),
      card(stats.positive, "正面"),
      card(stats.negative, "负面"),
      card(stats.total_reviews_in_db, "评论样本"),
    ].join("");
    const max = Math.max.apply(null, stats.breakdown.map((item) => item.mentions || 0)) || 1;
    barsBox.innerHTML = stats.breakdown.map((item) => {
      const ratio = Math.round((item.negative_ratio || 0) * 100);
      const width = Math.max(4, Math.round((item.mentions || 0) / max * 100));
      return '<div class="bar-row"><span>' + esc(item.label) + "</span>" +
        '<div class="bar"><i style="width:' + width + '%"></i></div>' +
        "<small>" + esc(item.mentions) + " 次 / 负 " + ratio + "%</small></div>";
    }).join("");
    return;
  }

  statsBox.innerHTML = [
    card(stats.mentions, "提及次数"),
    card(stats.positive, "正面"),
    card(stats.negative, "负面"),
    card((Math.round((stats.negative_ratio || 0) * 100)) + "%", "负面占比"),
  ].join("");
}

function card(value, label) {
  return '<div class="stat"><b>' + esc(value) + "</b><span>" + esc(label) + "</span></div>";
}

function renderSources(sources) {
  const box = $("sources");
  if (!sources || !sources.length) { box.innerHTML = ""; return; }
  box.innerHTML = "证据来源：" + sources.map((item) => "<code>" + esc(item) + "</code>").join("");
}

function renderMeta(meta) {
  const badges = $("badges");
  const trace = $("trace");
  badges.innerHTML = "";
  trace.innerHTML = "";
  if (!meta) return;

  const parts = [];
  parts.push(badge("耗时 " + (meta.latency_ms || 0) + " ms", ""));
  parts.push(badge("tokens " + (meta.input_tokens || 0) + " / " + (meta.output_tokens || 0), ""));
  parts.push(badge("工具轮次 " + (meta.tool_rounds || 0), ""));
  if (meta.memory_turns) parts.push(badge("上下文 " + meta.memory_turns + " 轮", ""));
  if (meta.cached) parts.push(badge("缓存命中", "ok"));
  parts.push(meta.guarded ? badge("护栏触发", "warn") : badge("未被护栏截断", "ok"));
  badges.innerHTML = parts.join("");

  (meta.trace || []).forEach((item) => {
    const text = item.seconds != null
      ? item.node + " · " + item.seconds + "s"
      : item.node + " · in " + (item.input_tokens || 0) + " / out " + (item.output_tokens || 0);
    trace.innerHTML += "<span>" + esc(text) + "</span>";
  });
}

function badge(text, kind) {
  return '<span class="badge ' + (kind || "") + '">' + esc(text) + "</span>";
}

function appendNode(data) {
  const label = data.node + (data.question_type ? " · " + data.question_type : "");
  $("nodes").textContent = "节点：" + label;
}

async function askSync(payload) {
  const response = await fetch("/api/v1/analysis/analyze", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  if (!response.ok) throw new Error(await response.text());
  const body = await response.json();
  render(body, body.meta);
}

async function askStream(payload) {
  const response = await fetch("/api/v1/analysis/analyze/stream", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  if (!response.ok) throw new Error(await response.text());

  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let index;
    while ((index = buffer.indexOf("\n\n")) >= 0) {
      const chunk = buffer.slice(0, index);
      buffer = buffer.slice(index + 2);
      let event = "message";
      let raw = "";
      chunk.split("\n").forEach((line) => {
        if (line.startsWith("event:")) event = line.slice(6).trim();
        if (line.startsWith("data:")) raw += line.slice(5).trim();
      });
      if (!raw) continue;
      const data = JSON.parse(raw);
      if (event === "node") {
        appendNode(data);
        if (data.answer) render(data, data.meta);
      } else if (event === "error") {
        throw new Error(data.message || "分析失败");
      } else if (event === "done") {
        setStatus("完成 · 总耗时 " + (data.latency_ms || 0) + " ms");
      }
    }
  }
}

async function run() {
  const question = $("question").value.trim();
  if (!question) { setStatus("请先输入问题"); return; }

  const payload = { question: question };
  const product = $("product").value.trim();
  if (product) payload.product_id = product;
  if ($("multi").checked) {
    if (!sessionId) newSession();
    payload.session_id = sessionId;
  }

  $("run").disabled = true;
  $("nodes").textContent = "";
  setStatus("分析中…");
  try {
    if ($("stream").checked) await askStream(payload);
    else { await askSync(payload); setStatus("完成"); }
  } catch (error) {
    setStatus("请求失败：" + (error.message || error));
  } finally {
    $("run").disabled = false;
  }
}

$("run").addEventListener("click", run);
$("question").addEventListener("keydown", (event) => {
  if ((event.metaKey || event.ctrlKey) && event.key === "Enter") run();
});
</script>
</body>
</html>
