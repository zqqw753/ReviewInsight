services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHROMA_PERSIST_DIR=/data/chroma_db
      - DB_PATH=/data/reviews.db
      - PROCESSED_FILES_LOG=/data/processed_files.json
      # 【P0-稳定性】模型已烘焙进镜像，运行时禁止回源 HF，避免网络抖动导致长时间重试
      - HF_HUB_OFFLINE=1
    volumes:
      - chroma_data:/data/chroma_db
      - review_data:/data  
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  chroma_data:
  review_data: